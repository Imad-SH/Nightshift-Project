parent=base
import=common/keycloak
styles=css/styles.css

# Product branding on the sign-in pages (BlueSec appears as the company: "by BlueSec")
productName=Nightshift
productTagline=The AI analyst that never clocks out

# Class names used by Keycloak's built-in pages (password change, errors, OTP...), so
# they render in the same design as our own templates
kcFormClass=ns-form
kcFormGroupClass=ns-group
kcLabelClass=ns-label
kcInputClass=ns-input
kcInputGroup=ns-input-group
kcInputErrorMessageClass=ns-field-error
kcAlertClass=ns-alert
kcAlertTitleClass=ns-alert-text
kcButtonClass=ns-btn
kcButtonPrimaryClass=ns-btn-primary
kcButtonDefaultClass=ns-btn-secondary
kcButtonBlockClass=ns-btn-block
kcButtonLargeClass=
kcFormButtonsClass=ns-buttons
kcFormOptionsClass=ns-options
kcFormPasswordVisibilityButtonClass=ns-eye
kcFormPasswordVisibilityIconShow=ns-icon-eye
kcFormPasswordVisibilityIconHide=ns-icon-eye-off
