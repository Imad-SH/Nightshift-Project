

services:
  backend:
    build: .
    container_name: backend
    # Development: run from the mounted source with auto-reload (the image itself is production-ready)
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    user: root
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - cortex-downloads:/app/downloads
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:5173
      - POSTGRES_SERVER=postgres
      - POSTGRES_USER=cortex
      - POSTGRES_PASSWORD=cortex
      - POSTGRES_DB=cortex
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - cortex-network
      - wazuh_wazuh
      - flowintel_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=cortex
      - POSTGRES_PASSWORD=cortex
      - POSTGRES_DB=cortex
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - cortex-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - cortex-network
      - wazuh_wazuh
      - flowintel_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: bluesec-keycloak-fixed
    container_name: keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_THEME_CACHE_THEMES=false
      - KC_THEME_CACHE_TEMPLATES=false
      - KC_THEME_STATIC_MAX_AGE=0
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8080:8080"
    command: start-dev
    volumes:
      - ./keycloak-theme:/opt/keycloak/themes
      - keycloak-data:/opt/keycloak/data
    networks:
      - cortex-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - ../:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      # Inside this container the backend is reached by its service name, not localhost
      - VITE_DEV_API_TARGET=http://backend:8000
    networks:
      - cortex-network
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  postgres-data:
  cortex-downloads:
  frontend_node_modules:
  keycloak-data:


networks:
  cortex-network:
    driver: bridge
  wazuh_wazuh:
    external: true
  flowintel_default:
    driver: bridge
