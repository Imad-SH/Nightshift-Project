version: '3.8'

services:
  postgresql:
    container_name: flowintel-db
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-flowintel}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-flowintel}
      - POSTGRES_DB=${POSTGRES_DB:-flowintel}
    volumes:
      - flowintel-db-data:/var/lib/postgresql/data
    networks:
      - flowintel-net
    restart: unless-stopped

  valkey:
    container_name: flowintel-cache
    image: valkey/valkey:8-alpine
    ports:
      - '${VALKEY_PORT:-6380}:6379'
    volumes:
      - flowintel-cache-data:/data
    networks:
      - flowintel-net
    restart: unless-stopped

  flowintel:
    image: ghcr.io/flowintel/flowintel:latest
    container_name: flowintel-app
    # Fix: Removed -i flag and added TTY for stable startup in non-interactive Docker environments
    command: bash ./launch.sh -ld
    tty: true
    stdin_open: true
    ports:
      - '${APP_PORT:-7006}:7006'
    environment:
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-flowintel}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-flowintel}
      - DB_NAME=${POSTGRES_DB:-flowintel}
      - VALKEY_IP=${VALKEY_IP:-valkey}
    networks:
      - flowintel-net
    depends_on:
      - postgresql
      - valkey
    volumes:
      - flowintel-app-data:/var/lib/flowintel
    restart: unless-stopped

networks:
  flowintel-net:
    driver: bridge

volumes:
  flowintel-db-data:
  flowintel-cache-data:
  flowintel-app-data:
