# BlueSec Nightshift: production stack.
#
# Configuration comes from nightshift.env (see nightshift.env.example):
#   docker compose --env-file nightshift.env up -d
# install.sh generates that file and runs this for you.
#
# Only the web container publishes ports. Postgres, Redis, Keycloak and the
# backend are reachable only on the internal network.

name: nightshift

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nightshift
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in nightshift.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in nightshift.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightshift -d nightshift"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in nightshift.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  keycloak:
    image: ${NIGHTSHIFT_REGISTRY:-}nightshift-keycloak:${NIGHTSHIFT_VERSION:?set NIGHTSHIFT_VERSION}
    restart: unless-stopped
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${NIGHTSHIFT_PUBLIC_URL:?set NIGHTSHIFT_PUBLIC_URL in nightshift.env}/auth
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in nightshift.env}
      # Read by the realm import (allowed login redirect address)
      NIGHTSHIFT_PUBLIC_URL: ${NIGHTSHIFT_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    logging: *logging

  backend:
    image: ${NIGHTSHIFT_REGISTRY:-}nightshift-backend:${NIGHTSHIFT_VERSION}
    restart: unless-stopped
    environment:
      DEBUG: "false"
      NIGHTSHIFT_SECRET_KEY: ${NIGHTSHIFT_SECRET_KEY:?set NIGHTSHIFT_SECRET_KEY in nightshift.env}
      POSTGRES_SERVER: postgres
      POSTGRES_DB: nightshift
      POSTGRES_USER: nightshift
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: nightshift
      KEYCLOAK_CLIENT_ID: bluesec-frontend
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      FRONTEND_URL: ${NIGHTSHIFT_PUBLIC_URL}
      # The UI is served from the public URL: no cross-origin API access, sockets only from there
      CORS_ALLOWED_ORIGINS: ""
      SOCKETIO_CORS_ALLOWED_ORIGINS: ${NIGHTSHIFT_PUBLIC_URL}
      VENDOR_NAME: ${VENDOR_NAME:-BlueSec}
      PRODUCT_NAME: ${PRODUCT_NAME:-Nightshift}
    volumes:
      - downloads:/app/downloads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging: *logging

  web:
    image: ${NIGHTSHIFT_REGISTRY:-}nightshift-web:${NIGHTSHIFT_VERSION}
    restart: unless-stopped
    environment:
      NIGHTSHIFT_PUBLIC_URL: ${NIGHTSHIFT_PUBLIC_URL}
      TLS_ENABLED: ${TLS_ENABLED:-true}
      KEYCLOAK_ADMIN_CONSOLE: ${KEYCLOAK_ADMIN_CONSOLE:-disabled}
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    logging: *logging

volumes:
  postgres-data:
  redis-data:
  downloads:
